name: Rust CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: server_manager

    - name: Install Rust
      run: rustup update stable && rustup default stable

    - name: Build
      run: cd server_manager && cargo build --verbose

    - name: Run tests
      run: cd server_manager && cargo test --verbose

    - name: Run clippy
      run: cd server_manager && cargo clippy --all-targets --all-features -- -D warnings

    - name: Check formatting
      run: cd server_manager && cargo fmt -- --check
