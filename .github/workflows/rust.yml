name: CI Gate

on:
  push:
    branches:
      - main
      - "gate/*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify & Test Gatekeeper
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2.7.7
        with:
          workspaces: "server_manager"

      - name: Install cargo-deny & cargo-audit
        uses: taiki-e/install-action@e85bddd15a6534f63d5cac892707c03d5db74669 # v2.49.20
        with:
          tool: cargo-deny,cargo-audit

      - name: Run Unified Verification Script
        run: |
          chmod +x ./verify.sh
          ./verify.sh
