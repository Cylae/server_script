version: null
services:
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    restart: unless-stopped
    ports:
    - 127.0.0.1:6767:6767
    environment:
    - COMPlus_EnableDiagnostics=0
    - PGID=1000
    - PUID=1000
    volumes:
    - ./config/bazarr:/config
    - ./media:/media
    networks:
    - server_manager_net
    healthcheck:
      test:
      - CMD-SHELL
      - curl -f http://localhost:6767/ping || exit 1
      interval: 1m
      retries: 3
      start_period: 30s
      timeout: 10s
    deploy:
      resources:
        limits:
          memory: 1G
    logging:
      driver: json-file
      options:
        max-file: '3'
        max-size: 10m
  dnscrypt-proxy:
    image: klutchell/dnscrypt-proxy:latest
    container_name: dnscrypt-proxy
    restart: unless-stopped
    ports:
    - 5300:5053/tcp
    - 5300:5053/udp
    volumes:
    - ./config/dnscrypt:/config
    networks:
    - server_manager_net
    deploy:
      resources:
        limits:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-file: '3'
        max-size: 10m
  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: filebrowser
    restart: unless-stopped
    ports:
    - 127.0.0.1:8002:80
    volumes:
    - ./config/filebrowser:/config
    - ./media:/srv
    - ./config/filebrowser/filebrowser.db:/database.db
    networks:
    - server_manager_net
    logging:
      driver: json-file
      options:
        max-file: '3'
        max-size: 10m
  gitea:
    image: gitea/gitea:latest
    container_name: gitea
    restart: unless-stopped
    ports:
    - 127.0.0.1:3000:3000
    - 2222:22
    environment:
    - GITEA__database__DB_TYPE=mysql
    - GITEA__database__HOST=mariadb:3306
    - GITEA__database__NAME=gitea
    - GITEA__database__PASSWD=deterministic_gitea_db
    - GITEA__database__USER=gitea
    volumes:
    - ./config/gitea:/data
    - /etc/timezone:/etc/timezone:ro
    - /etc/localtime:/etc/localtime:ro
    networks:
    - server_manager_net
    security_opt:
    - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-file: '3'
        max-size: 10m
  glpi:
    image: diouxx/glpi:latest
    container_name: glpi
    restart: unless-stopped
    ports:
    - 127.0.0.1:8088:80
    volumes:
    - ./config/glpi:/var/www/html/glpi
    networks:
    - server_manager_net
    security_opt:
    - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-file: '3'
        max-size: 10m
  jackett:
    image: lscr.io/linuxserver/jackett:latest
    container_name: jackett
    restart: unless-stopped
    ports:
    - 127.0.0.1:9117:9117
    environment:
    - COMPlus_EnableDiagnostics=0
    - PGID=1000
    - PUID=1000
    volumes:
    - ./config/jackett:/config
    - ./media:/media
    networks:
    - server_manager_net
    healthcheck:
      test:
      - CMD-SHELL
      - curl -f http://localhost:9117/ping || exit 1
      interval: 1m
      retries: 3
      start_period: 30s
      timeout: 10s
    deploy:
      resources:
        limits:
          memory: 1G
    logging:
      driver: json-file
      options:
        max-file: '3'
        max-size: 10m
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    ports:
    - 8096:8096
    environment:
    - PGID=1000
    - PUID=1000
    volumes:
    - ./config/jellyfin:/config
    - ./media/tv:/data/tvshows
    - ./media/movies:/data/movies
    - ./transcode_jellyfin:/transcode
    networks:
    - server_manager_net
    healthcheck:
      test:
      - CMD-SHELL
      - curl -f http://localhost:8096/health || exit 1
      interval: 1m
      retries: 3
      start_period: 30s
      timeout: 10s
    deploy:
      resources:
        limits:
          memory: 4G
    logging:
      driver: json-file
      options:
        max-file: '3'
        max-size: 10m
  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    restart: unless-stopped
    ports:
    - 127.0.0.1:5056:5055
    volumes:
    - ./config/jellyseerr:/app/config
    networks:
    - server_manager_net
    deploy:
      resources:
        limits:
          memory: 1G
    logging:
      driver: json-file
      options:
        max-file: '3'
        max-size: 10m
  mailserver:
    image: mailserver/docker-mailserver:latest
    container_name: mailserver
    restart: unless-stopped
    ports:
    - 25:25
    - 143:143
    - 587:587
    - 993:993
    environment:
    - DMS_DEBUG=0
    - ENABLE_CLAMAV=1
    - ENABLE_FAIL2BAN=1
    - ENABLE_POSTGREY=0
    - ENABLE_SPAMASSASSIN=1
    - ONE_DIR=1
    - POSTMASTER_ADDRESS=postmaster@example.com
    volumes:
    - ./config/mailserver/mail-data:/var/mail
    - ./config/mailserver/mail-state:/var/mail-state
    - ./config/mailserver/mail-logs:/var/log/mail
    - ./config/mailserver/config:/tmp/docker-mailserver
    - /etc/localtime:/etc/localtime:ro
    networks:
    - server_manager_net
    security_opt:
    - no-new-privileges:true
    cap_add:
    - NET_ADMIN
    logging:
      driver: json-file
      options:
        max-file: '3'
        max-size: 10m
  mariadb:
    image: lscr.io/linuxserver/mariadb:latest
    container_name: mariadb
    restart: unless-stopped
    environment:
    - MYSQL_DATABASE=server_manager
    - MYSQL_PASSWORD=deterministic_user_secret
    - MYSQL_ROOT_PASSWORD=deterministic_root_secret
    - MYSQL_USER=server_manager
    - PGID=1000
    - PUID=1000
    volumes:
    - ./config/mariadb:/config
    networks:
    - server_manager_net
    deploy:
      resources:
        limits:
          memory: 2G
    logging:
      driver: json-file
      options:
        max-file: '3'
        max-size: 10m
  netdata:
    image: netdata/netdata:latest
    container_name: netdata
    restart: unless-stopped
    ports:
    - 127.0.0.1:19999:19999
    volumes:
    - /proc:/host/proc:ro
    - /sys:/host/sys:ro
    - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
    - server_manager_net
    security_opt:
    - apparmor:unconfined
    cap_add:
    - SYS_PTRACE
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-file: '3'
        max-size: 10m
  nextcloud:
    image: lscr.io/linuxserver/nextcloud:latest
    container_name: nextcloud
    restart: unless-stopped
    ports:
    - 127.0.0.1:4443:443
    environment:
    - MYSQL_DATABASE=nextcloud
    - MYSQL_HOST=mariadb
    - MYSQL_PASSWORD=deterministic_nc_db
    - MYSQL_USER=nextcloud
    - PGID=1000
    - PUID=1000
    - REDIS_HOST=redis
    volumes:
    - ./config/nextcloud:/config
    - ./media:/data
    networks:
    - server_manager_net
    depends_on:
    - mariadb
    - redis
    logging:
      driver: json-file
      options:
        max-file: '3'
        max-size: 10m
  nginx-proxy:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
    - 80:80
    - 81:81
    - 443:443
    volumes:
    - ./config/npm:/data
    - ./config/npm/letsencrypt:/etc/letsencrypt
    networks:
    - server_manager_net
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-file: '3'
        max-size: 10m
  overseerr:
    image: lscr.io/linuxserver/overseerr:latest
    container_name: overseerr
    restart: unless-stopped
    ports:
    - 127.0.0.1:5055:5055
    volumes:
    - ./config/overseerr:/config
    networks:
    - server_manager_net
    deploy:
      resources:
        limits:
          memory: 1G
    logging:
      driver: json-file
      options:
        max-file: '3'
        max-size: 10m
  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    restart: unless-stopped
    ports:
    - 32400:32400
    environment:
    - PGID=1000
    - PLEX_MEDIA_SERVER_MAX_PLUGIN_PROCS=2
    - PUID=1000
    - VERSION=docker
    volumes:
    - ./config/plex:/config
    - ./media/tv:/tv
    - ./media/movies:/movies
    - ./transcode:/transcode
    networks:
    - server_manager_net
    healthcheck:
      test:
      - CMD-SHELL
      - curl -f http://localhost:32400/identity || exit 1
      interval: 1m
      retries: 3
      start_period: 30s
      timeout: 10s
    deploy:
      resources:
        limits:
          memory: 4G
    logging:
      driver: json-file
      options:
        max-file: '3'
        max-size: 10m
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    ports:
    - 127.0.0.1:9000:9000
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    - ./config/portainer:/data
    networks:
    - server_manager_net
    security_opt:
    - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-file: '3'
        max-size: 10m
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    ports:
    - 127.0.0.1:9696:9696
    environment:
    - COMPlus_EnableDiagnostics=0
    - PGID=1000
    - PUID=1000
    volumes:
    - ./config/prowlarr:/config
    - ./media:/media
    networks:
    - server_manager_net
    healthcheck:
      test:
      - CMD-SHELL
      - curl -f http://localhost:9696/ping || exit 1
      interval: 1m
      retries: 3
      start_period: 30s
      timeout: 10s
    deploy:
      resources:
        limits:
          memory: 1G
    logging:
      driver: json-file
      options:
        max-file: '3'
        max-size: 10m
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    ports:
    - 127.0.0.1:8080:8080
    - 6881:6881
    - 6881:6881/udp
    environment:
    - PGID=1000
    - PUID=1000
    - WEBUI_PORT=8080
    volumes:
    - ./config/qbittorrent:/config
    - ./media/downloads:/downloads
    networks:
    - server_manager_net
    logging:
      driver: json-file
      options:
        max-file: '3'
        max-size: 10m
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    ports:
    - 127.0.0.1:7878:7878
    environment:
    - COMPlus_EnableDiagnostics=0
    - PGID=1000
    - PUID=1000
    volumes:
    - ./config/radarr:/config
    - ./media:/media
    networks:
    - server_manager_net
    healthcheck:
      test:
      - CMD-SHELL
      - curl -f http://localhost:7878/ping || exit 1
      interval: 1m
      retries: 3
      start_period: 30s
      timeout: 10s
    deploy:
      resources:
        limits:
          memory: 1G
    logging:
      driver: json-file
      options:
        max-file: '3'
        max-size: 10m
  redis:
    image: redis:alpine
    container_name: redis
    restart: unless-stopped
    volumes:
    - ./config/redis:/data
    networks:
    - server_manager_net
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-file: '3'
        max-size: 10m
  roundcube:
    image: roundcube/roundcubemail:latest
    container_name: roundcube
    restart: unless-stopped
    ports:
    - 127.0.0.1:8090:80
    environment:
    - ROUNDCUBEMAIL_DB_TYPE=sqlite
    - ROUNDCUBEMAIL_SKIN=elastic
    volumes:
    - ./config/roundcube/db:/var/roundcube/db
    - ./config/roundcube/config:/var/roundcube/config
    networks:
    - server_manager_net
    depends_on:
    - mailserver
    security_opt:
    - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-file: '3'
        max-size: 10m
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    ports:
    - 127.0.0.1:8989:8989
    environment:
    - COMPlus_EnableDiagnostics=0
    - PGID=1000
    - PUID=1000
    volumes:
    - ./config/sonarr:/config
    - ./media:/media
    networks:
    - server_manager_net
    healthcheck:
      test:
      - CMD-SHELL
      - curl -f http://localhost:8989/ping || exit 1
      interval: 1m
      retries: 3
      start_period: 30s
      timeout: 10s
    deploy:
      resources:
        limits:
          memory: 1G
    logging:
      driver: json-file
      options:
        max-file: '3'
        max-size: 10m
  syncthing:
    image: lscr.io/linuxserver/syncthing:latest
    container_name: syncthing
    restart: unless-stopped
    ports:
    - 127.0.0.1:8384:8384
    - 22000:22000/tcp
    - 22000:22000/udp
    - 21027:21027/udp
    environment:
    - PGID=1000
    - PUID=1000
    volumes:
    - ./config/syncthing:/config
    - ./media:/media
    networks:
    - server_manager_net
    logging:
      driver: json-file
      options:
        max-file: '3'
        max-size: 10m
  tautulli:
    image: lscr.io/linuxserver/tautulli:latest
    container_name: tautulli
    restart: unless-stopped
    ports:
    - 127.0.0.1:8181:8181
    volumes:
    - ./config/tautulli:/config
    networks:
    - server_manager_net
    depends_on:
    - plex
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-file: '3'
        max-size: 10m
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    restart: unless-stopped
    ports:
    - 127.0.0.1:3001:3001
    volumes:
    - ./config/uptime-kuma:/app/data
    networks:
    - server_manager_net
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-file: '3'
        max-size: 10m
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    ports:
    - 127.0.0.1:8001:80
    environment:
    - ADMIN_TOKEN=deterministic_vw_token
    volumes:
    - ./config/vaultwarden:/data
    networks:
    - server_manager_net
    logging:
      driver: json-file
      options:
        max-file: '3'
        max-size: 10m
  wireguard:
    image: lscr.io/linuxserver/wireguard:latest
    container_name: wireguard
    restart: unless-stopped
    ports:
    - 51820:51820/udp
    volumes:
    - ./config/wireguard:/config
    - /lib/modules:/lib/modules
    networks:
    - server_manager_net
    cap_add:
    - NET_ADMIN
    - SYS_MODULE
    sysctls:
    - net.ipv4.conf.all.src_valid_mark=1
    deploy:
      resources:
        limits:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-file: '3'
        max-size: 10m
  yourls:
    image: yourls:latest
    container_name: yourls
    restart: unless-stopped
    ports:
    - 127.0.0.1:8003:80
    environment:
    - YOURLS_DB_HOST=mariadb
    - YOURLS_DB_NAME=yourls
    - YOURLS_DB_PASS=deterministic_user_secret
    - YOURLS_DB_USER=server_manager
    - YOURLS_PASS=deterministic_yourls_admin
    - YOURLS_USER=admin
    networks:
    - server_manager_net
    depends_on:
    - mariadb
    logging:
      driver: json-file
      options:
        max-file: '3'
        max-size: 10m
networks:
  server_manager_net:
    driver: bridge
